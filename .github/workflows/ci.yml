name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # The test suite only needs Node (node:test + node:sqlite), so it runs without installing dependencies.
    name: Syntax check and tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check
      - run: npm test

  build:
    name: Lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  browser:
    # The studio in real browsers: the Chrome checks against the production build, then Playwright
    # (pointer, keyboard, touch) in Chromium, Firefox and WebKit.
    name: Browser checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:browser
      # Playwright still runs when a Chrome check fails, so one run reports everything.
      - run: npx playwright install --with-deps chromium firefox webkit
        if: ${{ !cancelled() }}
      - run: npm run test:e2e
        if: ${{ !cancelled() }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
